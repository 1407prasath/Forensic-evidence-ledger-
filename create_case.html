{% extends "base.html" %}
{% block title %}Create Case — Forensic Evidence Ledger{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Create Case</h1>
  <a class="btn btn-secondary" href="{{ url_for('case_list') }}">&larr; Back to Cases</a>
</div>

<div class="card">
  <form method="post">
    <div class="form-grid">
      <div class="form-group">
        <label>Case ID</label>
        <input type="text" name="case_id" value="{{ suggested_id }}" required/>
      </div>
      <div class="form-group">
        <label>FIR No. *</label>
        <input type="text" name="fir_number" placeholder="e.g., FIR 112/2026" required/>
      </div>
      <div class="form-group">
        <label>Crime Type *</label>
        <input type="text" name="crime_type" placeholder="e.g., Cyber fraud" required/>
      </div>
      <div class="form-group">
        <label>Police Station *</label>
        <input type="text" name="police_station" placeholder="e.g., Cyber Crime Police Station, Vellore" required/>
      </div>
      <div class="form-group">
        <label>Officer ID *</label>
        <input type="text" name="officer" placeholder="e.g., OFF-1021" required/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="2" placeholder="Brief summary of the incident"></textarea>
      </div>
    </div>
    <button class="btn" type="submit">Create Case</button>
  </form>
</div>
{% endblock %}
